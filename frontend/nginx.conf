# CrediMarket · nginx del frontend: SPA con rutas de React Router (§10).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash en el nombre: caché larga.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Cualquier ruta cae en index.html (react-router decide la pantalla).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
