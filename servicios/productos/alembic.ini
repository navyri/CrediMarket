# P2-3 · Migraciones Alembic del servicio Productos
# Uso (desde servicios/productos/):  alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
version_locations = %(script_location)s/versions

# La URL se toma de la variable de entorno DATABASE_URL (nunca en el repo).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
