# CrediMarket · Parte 2 · Docker Compose (P2-2.7)
# Infraestructura: PostgreSQL (esquemas separados), RabbitMQ, Redis y MLflow con volúmenes
# persistentes para datos durables (§13.2). Los 4 microservicios y el frontend se agregan en
# P2-3…P2-8; este archivo es el "Compose inicial" de P2-2.7.
#
# Uso:  cp .env.example .env   (editar valores)   →   docker compose up -d

name: credimarket

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PASSWORD_PRODUCTOS: ${PASSWORD_PRODUCTOS}
      PASSWORD_CLIENTES: ${PASSWORD_CLIENTES}
      PASSWORD_PRESTAMOS: ${PASSWORD_PRESTAMOS}
      PASSWORD_INVENTORY: ${PASSWORD_INVENTORY}
    ports:
      # 5434 en el host: 5432 está ocupado por un PostgreSQL externo de la máquina (PID verificado
      # con netstat) y 5433 por otro proyecto; 5434 verificado libre (P2-2.8).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01_esquemas.sh:/docker-entrypoint-initdb.d/01_esquemas.sh:ro
    healthcheck:
      # Además de `pg_isready`, comprueba que el init de `01_esquemas.sh`
      # creó los 4 roles `svc_*`. Si el script no llega a correr (p. ej. el
      # shebang con CRLF en un clon de Windows), los servicios no podrían
      # autenticarse y entrarían en bucle de reinicios sin un aviso claro:
      # con esta comprobación el fallo queda visible en `postgres unhealthy`
      # y bloquea a los que dependen de `service_healthy` (P2-11.l).
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && PGPASSWORD=${POSTGRES_PASSWORD} psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc \"SELECT count(*) FROM pg_roles WHERE rolname IN ('svc_productos','svc_clientes','svc_prestamos','svc_inventario')\" | grep -q '^4$$'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  productos:
    build:
      context: .
      dockerfile: servicios/productos/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://svc_productos:${PASSWORD_PRODUCTOS}@postgres:5432/credimarket
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CACHE_TTL_SEG: ${CACHE_TTL_SEG:-60}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  clientes:
    build:
      context: .
      dockerfile: servicios/clientes/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://svc_clientes:${PASSWORD_CLIENTES}@postgres:5432/credimarket
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXP_MIN: ${JWT_EXP_MIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@credimarket.demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CAMBIAR_admin_local}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  inventario:
    build:
      context: .
      dockerfile: servicios/inventario/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://svc_inventario:${PASSWORD_INVENTORY}@postgres:5432/credimarket
      BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2Fcredimarket
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RESERVA_VENCIMIENTO_SEG: ${RESERVA_VENCIMIENTO_SEG}
      INTERVALO_VENCIMIENTO_SEG: ${INTERVALO_VENCIMIENTO_SEG:-15}
      INTERVALO_OUTBOX_SEG: ${INTERVALO_OUTBOX_SEG:-1}
      MAX_INTENTOS: ${REINTENTOS_BROKER:-3}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  prestamos:
    build:
      context: .
      dockerfile: servicios/prestamos/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://svc_prestamos:${PASSWORD_PRESTAMOS}@postgres:5432/credimarket
      BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2Fcredimarket
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      CORS_ORIGINS: ${CORS_ORIGINS}
      URL_CLIENTES: http://clientes:8002
      URL_PRODUCTOS: http://productos:8001
      URL_MLFLOW: http://mlflow:5000
      # §8.D: el modelo activo vive en el volumen montado (promoción/rollback
      # persisten fuera del contenedor y el servicio lo recarga en caliente).
      MODELO_DIR: /modelos
      TASA_MENSUAL_OFICIAL: ${TASA_MENSUAL_OFICIAL:-0.018}
      RATIO_DEUDA_INGRESO_MAX: ${RATIO_DEUDA_INGRESO_MAX:-1.0}
      INTERVALO_RECHARGA_MODELO_SEG: ${INTERVALO_RECHARGA_MODELO_SEG:-10}
      INTERVALO_OUTBOX_SEG: ${INTERVALO_OUTBOX_SEG:-1}
      MAX_INTENTOS: ${REINTENTOS_BROKER:-3}
    ports:
      - "8003:8003"
    volumes:
      - ./ml/modelos:/modelos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"   # panel para la demostración (§5.2)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  mlflow:
    image: python:3.14-slim
    restart: unless-stopped
    working_dir: /mlflow
    # MLflow con backend y artefactos en volumen persistente (P2-2.6, §8.C)
    # Nota: comando en UNA línea a propósito; YAML `>` con líneas más indentadas
    # introduce saltos literales que el shell ejecuta como órdenes separadas.
    command: sh -c "pip install --no-cache-dir mlflow==3.17.2 && mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  frontend:
    # Build de producción (Vite) servido por nginx; el navegador del usuario
    # consume las APIs directamente en localhost:8001-8004 (§10).
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 8090 en el host: 5173 lo ocupa otra aplicación de la máquina, 5174 es
      # el respaldo de Vite en desarrollo y 8080 otra app local (verificado
      # con netstat antes de publicar).
      - "8090:80"
    depends_on:
      - productos
      - clientes
      - prestamos
      - inventario
    healthcheck:
      # 127.0.0.1 y no `localhost`: en la imagen alpine el nombre resuelve
      # primero a ::1 y nginx solo escucha IPv4, así que el wget fallaba con
      # "connection refused" y el contenedor se quedaba unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  mlflowdata:
